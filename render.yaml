services:
  - type: web
    name: research-ai
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_NAME
        value: Research AI
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 8000
      - key: DEBUG
        value: "false"
      - key: SEARCH_PROVIDER
        value: auto
      - key: ALLOW_PRIVATE_NETWORKS
        value: "false"
